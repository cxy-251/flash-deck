[project]
name = "omni-deck"
version = "3.0.0"
description = "Omni Deck — Steam Deck (SteamOS/Linux) 本地游戏与媒体中心"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "burnysc2>=7.1.3",
    "curl_cffi>=0.14.0",
    "docutils>=0.23",
    "edge-tts>=7",
    "jmcomic>=2.7.5",
    "mpyq>=0.2.5",
    "opencc-python-reimplemented>=0.1.7",
    "protobuf==3.20.3",
    "pyqt6>=6.6.0",
    "pyqt6-webengine>=6.6.0",
    "websockets>=16.1.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
