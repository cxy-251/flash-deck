<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; background: #000000; overflow: hidden;
        }
        #display {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        #game {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>
    <div id="display">
        <div id="game"></div>
    </div>

    <script>
        window.addEventListener('error', e => console.error('JS_ERR_STACK:', e.error ? e.error.stack : e.message));
        window.addEventListener('unhandledrejection', e => console.error('PROMISE_REJ_STACK:', e.reason ? e.reason.stack : e.reason));

        // 静音/安全处理 WakeLock 权限拒绝
        if ('wakeLock' in navigator) {
            try {
                const _req = navigator.wakeLock.request;
                navigator.wakeLock.request = function() {
                    return _req.apply(this, arguments).catch(() => ({ release: () => Promise.resolve() }));
                };
            } catch(e) {}
        }

        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id') || '';
        const system = params.get('system') || 'nes';
        const romFile = params.get('rom') || '';
        
        let gameUrl = '/retro_rom/' + encodeURIComponent(gameId);
        if (romFile) {
            gameUrl += '/' + encodeURIComponent(romFile);
        }

        window.EJS_player = '#game';
        window.EJS_gameName = gameId;
        window.EJS_core = system;
        window.EJS_gameUrl = gameUrl;
        window.EJS_pathtodata = '/emulatorjs/data/';
        window.EJS_startOnLoaded = true;
        window.EJS_disableDatabases = true;
        window.EJS_forceLegacyCores = true;
        window.EJS_threads = false;
        window.EJS_language = 'zh-CN';
    </script>
    <script src="/emulatorjs/data/loader.js"></script>
</body>
</html>
