<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 游戏库</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 760px;
        }
        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 14px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f0f6fc;
            letter-spacing: 0.5px;
        }
        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #f0f6fc;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .item:hover {
            background: #21262d;
            border-color: #58a6ff;
            color: #58a6ff;
            transform: translateX(4px);
        }
        .item .arrow {
            color: #8b949e;
            font-size: 14px;
            transition: color 0.15s;
        }
        .item:hover .arrow {
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>RPG 游戏库</h1>
        </div>

        <div class="list" id="game-list">
            <!-- 仅展示已就绪的真实游戏列表 -->
        </div>
    </div>

    <script>
        fetch('/api/games')
            .then(res => res.json())
            .then(games => {
                const list = document.getElementById('game-list');
                list.innerHTML = '';

                games.forEach(g => {
                    const item = document.createElement('a');
                    item.className = 'item';
                    item.href = `action://play-rpg?id=${encodeURIComponent(g.id)}&title=${encodeURIComponent(g.name)}`;
                    item.innerHTML = `
                        <span>${g.name}</span>
                        <span class="arrow">进入 ➔</span>
                    `;
                    list.appendChild(item);
                });
            })
            .catch(err => {
                console.error('Failed to load games:', err);
            });
    </script>
</body>
</html>
